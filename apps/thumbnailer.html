<div class="thumbnail-tool-container">
  <div class="tt-panel">
    <div class="tt-group">
      <div class="tt-row">
        <input type="file" id="file-input" accept="image/*">
        <label for="file-input" class="button">Open Image</label>
        <button id="url-button">Open URL</button>
        <button id="add-text-button" disabled>Add Text</button>
        <button id="system-fonts-button" hidden>Use System Fonts</button>
      </div>
      <div class="tt-row">
        <button id="remove-bg-button" disabled>Remove Background</button>
      </div>
      <div class="tt-row">
        <button id="export-project-button" disabled>Save Project</button>
        <label for="project-input" class="button">Load Project</label>
        <input type="file" id="project-input" accept="application/json,.json" hidden>
        <button id="clear-button" disabled>Clear</button>
      </div>
      <datalist id="font-list"></datalist>
    </div>

    <div class="tt-group">
      <h3>Crop Regions</h3>
      <div class="tt-row">
        <label><input type="checkbox" id="show-landscape" checked> Landscape</label>
        <select id="ratio-landscape">
          <option value="16:9">16:9</option>
          <option value="3:2">3:2</option>
          <option value="4:3" selected>4:3</option>
          <option value="5:4">5:4</option>
          <option value="1:1">1:1</option>
        </select>
        <button id="download-landscape" disabled>Download</button>
      </div>
      <div class="tt-row">
        <label><input type="checkbox" id="show-portrait" checked> Portrait</label>
        <select id="ratio-portrait">
          <option value="9:16">9:16</option>
          <option value="2:3">2:3</option>
          <option value="3:4" selected>3:4</option>
          <option value="4:5">4:5</option>
          <option value="1:1">1:1</option>
        </select>
        <button id="download-portrait" disabled>Download</button>
      </div>
      <div class="tt-row">
        <button id="download-full" disabled>Download Full Image</button>
      </div>
    </div>

    <div class="tt-group">
      <h3>Text Boxes</h3>
      <div id="text-list"></div>
    </div>

    <div class="tt-group">
      <div class="tt-row tt-head">
        <h3>Exact Size</h3>
        <select id="size-unit" title="Units"><option value="in">in</option><option value="mm">mm</option></select>
      </div>
      <div class="tt-row">
        <label><input type="radio" name="size-mode" value="none" checked> No scaling</label>
      </div>
      <div class="tt-row">
        <label><input type="radio" name="size-mode" value="width"> Exact width</label>
        <input type="number" id="size-width" min="0" step="any" disabled>
      </div>
      <div class="tt-row">
        <label><input type="radio" name="size-mode" value="height"> Exact height</label>
        <input type="number" id="size-height" min="0" step="any" disabled>
      </div>
      <div class="tt-row">
        <button id="print-button" disabled>Print</button>
        <label><input type="checkbox" id="print-border"> Cutting border</label>
      </div>
    </div>
  </div>

  <div class="tt-workspace">
    <div class="tt-empty">Open an image to get started. Drag text and crop corners on the preview.</div>
    <canvas id="preview-canvas"></canvas>
  </div>
</div>

<script>
  // Get references to DOM elements
  const fileInput = document.getElementById('file-input');
  const addTextButton = document.getElementById('add-text-button');
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const emptyState = document.querySelector('.tt-empty');
  const workspace = document.querySelector('.tt-workspace');
  const textList = document.getElementById('text-list');

  // Project file schema. Bump the major when the shape stops being readable as-is.
  const SCHEMA_VERSION = '1.2.0';

  // Store original image data
  let originalImage = null;
  let originalFilename = '';
  let imageDataURL = '';

  // Every text property, so imported files can be missing fields and still load
  const TEXT_DEFAULTS = {
    text: '',
    font: 'Impact',
    size: 48,
    bold: false,
    italic: false,
    align: 'left',
    color: '#ffffff',
    shadow: 0,
    shadowOpacity: 100,
    shadowColor: '#000000',
    x: 0,
    y: 0,
    w: 0,
    h: 0
  };

  // Preview scale: image pixels -> canvas pixels
  let scale = 1;

  // Text boxes, positioned and sized in image pixel coordinates
  const FONT_FALLBACK = 'sans-serif';
  let FONTS = ['Arial', 'Impact', 'Georgia', 'Times New Roman', 'Courier New',
               'Verdana', 'Trebuchet MS', 'Comic Sans MS'];
  let texts = [];
  let selected = -1;

  // Crop rectangle state, one rect per orientation
  const crops = [
    { key: 'landscape', label: 'Landscape', ratio: 4 / 3, show: true, x: 0, y: 0, w: 0, h: 0 },
    { key: 'portrait', label: 'Portrait', ratio: 3 / 4, show: true, x: 0, y: 0, w: 0, h: 0 }
  ];

  // What the pointer is currently dragging, if anything
  let drag = null;

  // Largest rect of the given aspect ratio, centred in the image
  function fitRect(imgW, imgH, ratio) {
    let w = imgW, h = w / ratio;
    if (h > imgH) { h = imgH; w = h * ratio; }
    return { x: (imgW - w) / 2, y: (imgH - h) / 2, w: w, h: h };
  }

  function clamp(v, lo, hi) {
    return Math.min(Math.max(v, lo), hi);
  }

  // How far a line shifts inside its block, given the block's widest line
  function alignOffset(blockWidth, lineWidth, align) {
    const slack = blockWidth - lineWidth;
    return align === 'center' ? slack / 2 : align === 'right' ? slack : 0;
  }

  // <input type="color"> only gives 6-digit hex, so the alpha rides in separately
  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  function parseRatio(str) {
    const parts = str.split(':');
    return parts[0] / parts[1];
  }

  // Triggered when a file is selected through the file input
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) {
      loadImageFromFile(fileInput.files[0]);
    }
  });

  // fetch rather than <img src>: a cross-origin image would taint the canvas and block
  // downloads, and project files need the bytes as a data URL anyway.
  document.getElementById('url-button').addEventListener('click', function () {
    const url = prompt('Image URL');
    if (!url) return;
    fetch(url.trim()).then(function (res) {
      if (!res.ok) throw new Error('server answered ' + res.status);
      return res.blob();
    }).then(function (blob) {
      if (!blob.type.startsWith('image/')) throw new Error('that URL is not an image');
      const name = decodeURIComponent(new URL(url.trim(), location.href).pathname.split('/').pop());
      loadImageFromFile(new File([blob], name, { type: blob.type }));
    }).catch(function (err) {
      // fetch reports a CORS block as a bare TypeError
      alert('Could not load that image: ' + (err instanceof TypeError
        ? 'the site does not allow other pages to read its images. Download it and use Open Image instead.'
        : err.message));
    });
  });

  // Positions follow each axis so text keeps its place; size uses the smaller factor
  // so text never outgrows the image when the aspect ratio changes.
  function scaleTexts(list, kx, ky) {
    const k = Math.min(kx, ky);
    list.forEach(function (t) {
      t.x *= kx;
      t.y *= ky;
      t.size = Math.max(4, Math.round(t.size * k));
      t.shadow = Math.round(t.shadow * k);
    });
  }

  function loadImageFromFile(file) {
    if (!file.type.startsWith('image/')) return;
    const name = file.name.replace(/\.[^.]+$/, '') || 'thumbnail';
    const reader = new FileReader();
    reader.onload = function () {
      const prev = originalImage;
      // Text boxes and settings carry over, scaled to the new image; crop rects refit it
      setImage(reader.result, name, function () {
        if (prev) scaleTexts(texts, originalImage.width / prev.width, originalImage.height / prev.height);
        crops.forEach(function (c) {
          Object.assign(c, fitRect(originalImage.width, originalImage.height, c.ratio));
        });
      });
    };
    reader.readAsDataURL(file);
  }

  // Single entry point for "we now have an image": `after` seeds the project state
  // (fresh defaults, or whatever an imported file said) before the first draw.
  function setImage(dataURL, name, after) {
    const img = new Image();
    img.onload = function () {
      originalImage = img;
      imageDataURL = dataURL;
      originalFilename = name;
      after();
      document.querySelectorAll('button[disabled]').forEach(function (b) { b.disabled = false; });
      emptyState.style.display = 'none';
      canvas.style.display = 'block';
      renderTextList();
      resize();
    };
    img.onerror = function () { alert('Could not read the image data in that file.'); };
    img.src = dataURL;
  }

  // Size the preview canvas to fit the workspace without upscaling
  function resize() {
    if (!originalImage) return;
    const boxW = workspace.clientWidth - 20;
    const boxH = Math.max(240, window.innerHeight * 0.7);
    scale = Math.min(boxW / originalImage.width, boxH / originalImage.height, 1);
    canvas.width = Math.round(originalImage.width * scale);
    canvas.height = Math.round(originalImage.height * scale);
    draw();
  }
  window.addEventListener('resize', resize);

  // Family names come from typed input and imported files, so keep quotes out of the
  // CSS font shorthand we build from them
  function cleanFamily(family) {
    return String(family || '').replace(/["\\]/g, '').trim();
  }

  function fontString(t) {
    return (t.italic ? 'italic ' : '') + (t.bold ? 'bold ' : '') +
           t.size + 'px "' + cleanFamily(t.font) + '", ' + FONT_FALLBACK;
  }

  // document.fonts.check() reports true for any unknown family, so measure instead:
  // an unavailable family renders as the generic it falls back to, matching its width.
  const fontAvailableCache = {};
  function fontAvailable(family) {
    const name = cleanFamily(family);
    if (!name) return false;
    if (name in fontAvailableCache) return fontAvailableCache[name];
    const probe = document.createElement('canvas').getContext('2d');
    const sample = 'mmmmmmmmmmlliWWWW@';
    const available = ['monospace', 'serif', 'sans-serif'].some(function (generic) {
      probe.font = '72px ' + generic;
      const base = probe.measureText(sample).width;
      probe.font = '72px "' + name + '", ' + generic;
      return probe.measureText(sample).width !== base;
    });
    fontAvailableCache[name] = available;
    return available;
  }

  // Names every font the project asks for that this machine cannot render
  function missingFonts(list) {
    const seen = {};
    list.forEach(function (t) {
      const name = cleanFamily(t.font);
      if (name && !fontAvailable(name)) seen[name] = true;
    });
    return Object.keys(seen);
  }

  // Draws image + text at the given scale. Used for both the preview and the export,
  // so what you see is what you download.
  function drawScene(c, s) {
    c.save();
    c.scale(s, s);
    c.drawImage(originalImage, 0, 0);
    c.textBaseline = 'top';
    texts.forEach(function (t) {
      c.save();
      c.font = fontString(t);
      c.fillStyle = t.color;
      // Shadow blur ignores the transform matrix, so scale it by hand to match the export
      const shadowOn = t.shadow > 0 && t.shadowOpacity > 0;
      c.shadowColor = shadowOn ? hexToRgba(t.shadowColor, t.shadowOpacity / 100) : 'transparent';
      c.shadowBlur = t.shadow * s;
      // ponytail: newlines only, no auto-wrap. Add wrapping when a fixed box width is wanted.
      const lines = t.text.split('\n');
      const lineHeight = t.size * 1.2;
      const widths = lines.map(function (line) { return c.measureText(line).width; });
      const width = Math.max.apply(null, widths);
      lines.forEach(function (line, i) {
        // t.x stays the left edge of the block, alignment only shifts lines within it
        c.fillText(line, t.x + alignOffset(width, widths[i], t.align), t.y + i * lineHeight);
      });
      // Cache the bounding box (image coords) for hit testing and the selection outline
      t.w = width;
      t.h = lines.length * lineHeight;
      c.restore();
    });
    c.restore();
  }

  // Preview = scene + crop outlines + selection outline
  function draw() {
    if (!originalImage) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawScene(ctx, scale);

    crops.forEach(function (crop) {
      if (!crop.show) return;
      ctx.save();
      ctx.strokeStyle = crop.key === 'portrait' ? '#ff4081' : '#00e5ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(crop.x * scale, crop.y * scale, crop.w * scale, crop.h * scale);
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      corners(crop).forEach(function (p) {
        ctx.fillRect(p.x * scale - 5, p.y * scale - 5, 10, 10);
      });
      ctx.restore();
    });

    if (selected >= 0 && texts[selected]) {
      const t = texts[selected];
      ctx.save();
      ctx.strokeStyle = '#4285f4';
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(t.x * scale, t.y * scale, t.w * scale, t.h * scale);
      ctx.restore();
    }
    updateSizeFields();
  }

  function corners(crop) {
    return [
      { x: crop.x, y: crop.y, ax: crop.x + crop.w, ay: crop.y + crop.h },
      { x: crop.x + crop.w, y: crop.y, ax: crop.x, ay: crop.y + crop.h },
      { x: crop.x, y: crop.y + crop.h, ax: crop.x + crop.w, ay: crop.y },
      { x: crop.x + crop.w, y: crop.y + crop.h, ax: crop.x, ay: crop.y }
    ];
  }

  // Pointer position in image coordinates
  function imagePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width) / scale,
      y: (e.clientY - rect.top) * (canvas.height / rect.height) / scale
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    const p = imagePos(e);
    const tol = 8 / scale;

    // Crop handles win over everything else, they are small targets
    for (const crop of crops) {
      if (!crop.show) continue;
      for (const c of corners(crop)) {
        if (Math.abs(p.x - c.x) < tol && Math.abs(p.y - c.y) < tol) {
          drag = { type: 'resize', crop: crop, ax: c.ax, ay: c.ay };
          canvas.setPointerCapture(e.pointerId);
          return;
        }
      }
    }

    // Then text boxes, topmost first
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      if (p.x >= t.x && p.x <= t.x + t.w && p.y >= t.y && p.y <= t.y + t.h) {
        selected = i;
        markSelected();
        drag = { type: 'text', text: t, dx: p.x - t.x, dy: p.y - t.y };
        canvas.setPointerCapture(e.pointerId);
        draw();
        return;
      }
    }

    // Then moving a crop region
    for (const crop of crops) {
      if (!crop.show) continue;
      if (p.x >= crop.x && p.x <= crop.x + crop.w && p.y >= crop.y && p.y <= crop.y + crop.h) {
        drag = { type: 'move', crop: crop, dx: p.x - crop.x, dy: p.y - crop.y };
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }

    selected = -1;
    markSelected();
    draw();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    const p = imagePos(e);
    const iw = originalImage.width, ih = originalImage.height;

    if (drag.type === 'text') {
      drag.text.x = p.x - drag.dx;
      drag.text.y = p.y - drag.dy;
    } else if (drag.type === 'move') {
      drag.crop.x = clamp(p.x - drag.dx, 0, iw - drag.crop.w);
      drag.crop.y = clamp(p.y - drag.dy, 0, ih - drag.crop.h);
    } else if (drag.type === 'resize') {
      const crop = drag.crop;
      // Grow from the opposite corner, aspect locked, clipped to the image edges
      const maxW = p.x < drag.ax ? drag.ax : iw - drag.ax;
      const maxH = p.y < drag.ay ? drag.ay : ih - drag.ay;
      let w = Math.max(Math.abs(p.x - drag.ax), Math.abs(p.y - drag.ay) * crop.ratio);
      w = clamp(w, 20, Math.min(maxW, maxH * crop.ratio));
      crop.w = w;
      crop.h = w / crop.ratio;
      crop.x = p.x < drag.ax ? drag.ax - crop.w : drag.ax;
      crop.y = p.y < drag.ay ? drag.ay - crop.h : drag.ay;
    }
    draw();
  });

  canvas.addEventListener('pointerup', function () { drag = null; });
  canvas.addEventListener('pointercancel', function () { drag = null; });

  // Text box list ------------------------------------------------------------

  addTextButton.addEventListener('click', function () {
    texts.push(Object.assign({}, TEXT_DEFAULTS, {
      text: 'Your text here',
      size: Math.round(originalImage.height / 10),
      shadow: Math.round(originalImage.height / 60),
      x: originalImage.width * 0.1,
      y: originalImage.height * 0.1
    }));
    selected = texts.length - 1;
    renderTextList();
    draw();
  });

  function escapeHTML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderTextList() {
    textList.innerHTML = texts.map(function (t, i) {
      return '<div class="text-item' + (i === selected ? ' selected' : '') + '" data-i="' + i + '">' +
        '<div class="ti-head"><span>Text ' + (i + 1) + '</span><button data-act="del" title="Delete">&times;</button></div>' +
        '<textarea data-field="text" rows="2">' + escapeHTML(t.text) + '</textarea>' +
        '<div class="ti-warn"' + (fontAvailable(t.font) ? ' hidden' : '') + '>' +
          'Font not installed &mdash; showing ' + FONT_FALLBACK + '</div>' +
        '<div class="ti-row"><input data-field="font" list="font-list" value="' + escapeHTML(t.font) + '">' +
        '<label>Size<input type="number" data-field="size" min="4" value="' + t.size + '"></label>' +
        '<select data-field="align" title="Alignment">' +
          ['left', 'center', 'right'].map(function (a) {
            return '<option' + (a === t.align ? ' selected' : '') + '>' + a + '</option>';
          }).join('') +
        '</select></div>' +
        '<div class="ti-row">' +
          '<label><input type="checkbox" data-field="bold"' + (t.bold ? ' checked' : '') + '> Bold</label>' +
          '<label><input type="checkbox" data-field="italic"' + (t.italic ? ' checked' : '') + '> Italic</label>' +
          '<label>Color<input type="color" data-field="color" value="' + t.color + '"></label>' +
        '</div>' +
        '<div class="ti-row">' +
          '<label>Shadow radius<input type="number" data-field="shadow" min="0" value="' + t.shadow + '"></label>' +
          '<label>Opacity %<input type="number" data-field="shadowOpacity" min="0" max="100" value="' + t.shadowOpacity + '"></label>' +
          '<label>Color<input type="color" data-field="shadowColor" value="' + t.shadowColor + '"></label>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Only toggle the highlight class, rebuilding the list would steal focus mid-edit
  function markSelected() {
    Array.prototype.forEach.call(textList.children, function (el, i) {
      el.classList.toggle('selected', i === selected);
    });
  }

  function syncField(e) {
    const item = e.target.closest('.text-item');
    const field = e.target.dataset.field;
    if (!item || !field) return;
    const t = texts[+item.dataset.i];
    t[field] = e.target.type === 'checkbox' ? e.target.checked
             : e.target.type === 'number' ? +e.target.value
             : e.target.value;
    if (field === 'font') item.querySelector('.ti-warn').hidden = fontAvailable(t.font);
    draw();
  }

  // Both events: colour pickers on some browsers only fire 'change' when the native
  // dialog closes, which left the swatch updated but the state stale.
  textList.addEventListener('input', syncField);
  textList.addEventListener('change', syncField);

  textList.addEventListener('click', function (e) {
    const item = e.target.closest('.text-item');
    if (!item) return;
    const i = +item.dataset.i;
    if (e.target.dataset.act === 'del') {
      texts.splice(i, 1);
      selected = -1;
      renderTextList();
    } else {
      selected = i;
      markSelected();
    }
    draw();
  });

  // Font list ----------------------------------------------------------------

  const fontDatalist = document.getElementById('font-list');
  const systemFontsButton = document.getElementById('system-fonts-button');

  function renderFontList() {
    fontDatalist.innerHTML = FONTS.map(function (f) {
      return '<option value="' + escapeHTML(f) + '">';
    }).join('');
  }
  renderFontList();

  // Local Font Access API is Chromium-only and needs a user gesture, so it lives
  // behind a button that hides itself where the API is missing. Typing any installed
  // family name into the font box works regardless.
  if (window.queryLocalFonts) {
    systemFontsButton.hidden = false;
    systemFontsButton.addEventListener('click', function () {
      window.queryLocalFonts().then(function (fonts) {
        const families = fonts.map(function (f) { return f.family; });
        FONTS = Array.from(new Set(FONTS.concat(families))).sort();
        renderFontList();
        systemFontsButton.textContent = FONTS.length + ' Fonts Available';
      }).catch(function () {
        systemFontsButton.textContent = 'Font Access Denied';
      });
    });
  }

  // Crop controls and export -------------------------------------------------

  crops.forEach(function (crop) {
    // Read both: once these are radios, only the newly picked one fires 'change'
    document.getElementById('show-' + crop.key).addEventListener('change', function () {
      crops.forEach(function (c) { c.show = document.getElementById('show-' + c.key).checked; });
      draw();
    });
    document.getElementById('ratio-' + crop.key).addEventListener('change', function (e) {
      crop.ratio = parseRatio(e.target.value);
      Object.assign(crop, fitRect(originalImage.width, originalImage.height, crop.ratio));
      draw();
    });
    document.getElementById('download-' + crop.key).addEventListener('click', function () {
      const scaled = sizeMode !== 'none' && crop === activeCrop();
      exportRegion(crop, crop.key, scaled ? exportDpi(crop) : null);
    });
  });

  // Exact size ---------------------------------------------------------------

  // shortcut: "no scaling" assumes 96 DPI rather than reading the source file's DPI metadata;
  // read EXIF/JFIF/pHYs if prints of unscaled exports come out the wrong size.
  const DEFAULT_DPI = 96;
  const MM_PER_IN = 25.4;
  let sizeMode = 'none';
  let exactInches = null; // what the user typed into the active field, in inches

  function sizeField(dim) { return document.getElementById('size-' + dim); }
  function sizeUnit() { return document.getElementById('size-unit').value; }
  function toInches(v, unit) { return unit === 'mm' ? v / MM_PER_IN : v; }
  function fromInches(v, unit) { return +(unit === 'mm' ? v * MM_PER_IN : v).toFixed(2); }

  function orientationIsRadio() {
    return document.getElementById('show-landscape').type === 'radio';
  }

  // Physical sizes only make sense for one orientation at a time
  function activeCrop() {
    return orientationIsRadio() ? crops.filter(function (c) { return c.show; })[0] || null : null;
  }

  // DPI the chosen crop exports at, or null when there is nothing to size yet
  function exportDpi(crop) {
    if (!crop) return null;
    if (sizeMode === 'none') return DEFAULT_DPI;
    if (!(exactInches > 0)) return null;
    return Math.round(sizeMode === 'width' ? crop.w : crop.h) / exactInches || null;
  }

  // Fills every field except the one the user is typing in
  function updateSizeFields() {
    const crop = activeCrop();
    const dpi = exportDpi(crop);
    ['width', 'height'].forEach(function (dim) {
      if (dim === sizeMode) return;
      const px = crop && Math.round(dim === 'width' ? crop.w : crop.h);
      sizeField(dim).value = dpi ? fromInches(px / dpi, sizeUnit()) : '';
    });
  }

  function makeOrientationRadios() {
    const picked = crops.filter(function (c) { return c.show; })[0] || crops[0];
    crops.forEach(function (c) {
      const el = document.getElementById('show-' + c.key);
      el.type = 'radio';
      el.name = 'orientation';
      el.checked = c.show = c === picked;
    });
  }

  function makeOrientationCheckboxes() {
    crops.forEach(function (c) {
      const el = document.getElementById('show-' + c.key);
      el.type = 'checkbox';
      el.removeAttribute('name');
      el.checked = c.show;
    });
  }

  document.querySelectorAll('input[name="size-mode"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      if (radio.value !== 'none' && !orientationIsRadio()) {
        if (!confirm('Exact width and height only work with a single orientation, so ' +
                     'Landscape and Portrait will become pick-one options. Continue?')) {
          document.querySelector('input[name="size-mode"][value="' + sizeMode + '"]').checked = true;
          return;
        }
        makeOrientationRadios();
      }
      sizeMode = radio.value;
      ['width', 'height'].forEach(function (dim) { sizeField(dim).disabled = dim !== sizeMode; });
      // Start from whatever the field showed, so switching modes keeps the current size
      const v = sizeMode === 'none' ? NaN : parseFloat(sizeField(sizeMode).value);
      exactInches = v > 0 ? toInches(v, sizeUnit()) : null;
      draw();
      updateSizeFields(); // draw() bails before an image is loaded
    });
  });

  ['width', 'height'].forEach(function (dim) {
    sizeField(dim).addEventListener('input', function () {
      const v = parseFloat(sizeField(dim).value);
      exactInches = v > 0 ? toInches(v, sizeUnit()) : null;
      updateSizeFields();
    });
  });

  document.getElementById('size-unit').addEventListener('change', function () {
    if (sizeMode !== 'none') sizeField(sizeMode).value = exactInches ? fromInches(exactInches, sizeUnit()) : '';
    updateSizeFields();
  });

  // Print resolution: text is drawn as sharp as typical printers resolve
  const PRINT_PPI = 300;

  // Prints the chosen crop at its physical size. CSS inches are true inches on paper,
  // as long as the print dialog's scale stays at 100% / "actual size".
  document.getElementById('print-button').addEventListener('click', function () {
    const crop = activeCrop();
    const dpi = exportDpi(crop);
    if (!dpi) {
      alert('Pick Exact width or Exact height and enter a size first.');
      return;
    }
    // Physical size comes from the same rounded pixels the size fields use; the canvas
    // resolution is independent of it, so it never changes the printed size.
    const widthIn = Math.round(crop.w) / dpi;
    const heightIn = Math.round(crop.h) / dpi;
    const out = renderRegion(crop, PRINT_PPI / dpi);
    const frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;width:0;height:0;border:0;';
    document.body.appendChild(frame);
    const doc = frame.contentDocument;
    doc.open();
    // An outline sits outside the box, so the image keeps its exact size; the padding keeps
    // the outline clear of the page margin so it is not clipped.
    const border = document.getElementById('print-border').checked ? 'outline:0.2mm solid #000;' : '';
    doc.write('<!doctype html><title>' + escapeHTML(originalFilename) + '</title>' +
      '<style>body{margin:0;padding:1mm}img{display:block;' + border + 'width:' + widthIn +
      'in;height:' + heightIn + 'in}</style><img src="' + out.toDataURL() + '">');
    doc.close();
    doc.querySelector('img').decode().then(function () {
      frame.contentWindow.onafterprint = function () { frame.remove(); };
      frame.contentWindow.print();
    });
  });

  // Background removal -------------------------------------------------------

  // Loaded on first click only: library ~0.6 MB, model ~115 MB (WebGPU) or ~190 MB (CPU),
  // then kept in the browser cache. Both models are BiRefNet_lite, MIT licensed.
  // The 1024px model needs more than the 4 GB WebAssembly memory cap on CPU (std::bad_alloc),
  // so the CPU path uses a 512px export: softer edges, but it fits.
  const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js';
  const BG_MODEL_GPU = 'onnx-community/BiRefNet_lite-ONNX';
  const BG_MODEL_CPU = 'studioludens/birefnet-lite-512';
  const removeBgButton = document.getElementById('remove-bg-button');
  let bgRemover = null;

  removeBgButton.addEventListener('click', async function () {
    removeBgButton.disabled = true;
    try {
      if (!bgRemover) {
        removeBgButton.textContent = 'Loading model…';
        const { pipeline } = await import(TRANSFORMERS_URL);
        // navigator.gpu can exist with no usable adapter, so ask for one
        const gpu = navigator.gpu && await navigator.gpu.requestAdapter().catch(function () { return null; });
        bgRemover = await pipeline('background-removal', gpu ? BG_MODEL_GPU : BG_MODEL_CPU, {
          device: gpu ? 'webgpu' : 'wasm',
          dtype: gpu ? 'fp16' : 'fp32',
          progress_callback: function (p) {
            if (p.status === 'progress' && /\.onnx$/.test(p.file)) {
              removeBgButton.textContent = 'Downloading model ' + Math.round(p.progress) + '%';
            }
          }
        });
      }
      removeBgButton.textContent = 'Removing…';
      const blob = await (await bgRemover(imageDataURL)).toBlob();
      const dataURL = await new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      // Same pixel size, so text and crops stay exactly where they are
      setImage(dataURL, originalFilename + '-nobg', function () {});
    } catch (err) {
      alert('Background removal failed: ' + (err && err.message || err));
    } finally {
      removeBgButton.textContent = 'Remove Background';
      removeBgButton.disabled = false;
    }
  });

  // Clears text boxes and puts every control back to its HTML default; keeps the image
  document.getElementById('clear-button').addEventListener('click', function () {
    if (!confirm('Clear all text boxes and settings? The image stays open.')) return;
    texts = [];
    selected = -1;
    makeOrientationCheckboxes();
    document.querySelectorAll('.tt-panel input:not([type="file"]), .tt-panel select').forEach(function (el) {
      if (el.tagName === 'SELECT') {
        const i = Array.prototype.findIndex.call(el.options, function (o) { return o.defaultSelected; });
        el.selectedIndex = Math.max(i, 0);
      } else if (el.type === 'checkbox' || el.type === 'radio') {
        el.checked = el.defaultChecked;
      } else {
        el.value = el.defaultValue;
      }
    });
    crops.forEach(function (c) {
      c.ratio = parseRatio(document.getElementById('ratio-' + c.key).value);
      c.show = document.getElementById('show-' + c.key).checked;
      Object.assign(c, fitRect(originalImage.width, originalImage.height, c.ratio));
    });
    sizeMode = 'none';
    exactInches = null;
    ['width', 'height'].forEach(function (dim) { sizeField(dim).disabled = true; });
    renderTextList();
    draw();
  });

  // Standard CRC-32 as PNG chunks use it
  function crc32(bytes) {
    let crc = -1;
    for (let i = 0; i < bytes.length; i++) {
      crc ^= bytes[i];
      for (let k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
    }
    return (crc ^ -1) >>> 0;
  }

  // pHYs chunk: tells viewers and printers the physical size of a pixel
  function physChunk(dpi) {
    const ppm = Math.round(dpi / 0.0254);
    const chunk = new Uint8Array(21);
    const view = new DataView(chunk.buffer);
    view.setUint32(0, 9);
    chunk.set([0x70, 0x48, 0x59, 0x73], 4); // "pHYs"
    view.setUint32(8, ppm);
    view.setUint32(12, ppm);
    chunk[16] = 1; // unit: metre
    view.setUint32(17, crc32(chunk.subarray(4, 17)));
    return chunk;
  }

  document.getElementById('download-full').addEventListener('click', function () {
    exportRegion({ x: 0, y: 0, w: originalImage.width, h: originalImage.height }, 'full');
  });

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    // Revoking straight after click() can beat the download to the blob and kill it
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  // Re-renders the scene at full resolution, offset so the crop lands at the origin
  // A dpi stamps the PNG with a physical size; pixels are never resampled.
  // s scales the output: text is redrawn at that resolution, the photo is resampled to it
  function renderRegion(region, s) {
    s = s || 1;
    const out = document.createElement('canvas');
    out.width = Math.round(region.w * s);
    out.height = Math.round(region.h * s);
    const octx = out.getContext('2d');
    octx.imageSmoothingQuality = 'high';
    octx.translate(-region.x * s, -region.y * s);
    drawScene(octx, s);
    return out;
  }

  function exportRegion(region, suffix, dpi) {
    const out = renderRegion(region);
    const filename = originalFilename + '-' + suffix + '.png';
    out.toBlob(function (blob) {
      if (!dpi) return downloadBlob(blob, filename);
      blob.arrayBuffer().then(function (buf) {
        // Canvas PNGs carry no pHYs of their own. IHDR is always first: 8-byte signature + 25-byte chunk.
        const src = new Uint8Array(buf);
        downloadBlob(new Blob([src.subarray(0, 33), physChunk(dpi), src.subarray(33)],
                              { type: 'image/png' }), filename);
      });
    });
  }

  // Project files ------------------------------------------------------------

  const projectInput = document.getElementById('project-input');

  document.getElementById('export-project-button').addEventListener('click', function () {
    const name = prompt('Save project as', originalFilename + '.json');
    if (name === null) return;
    const project = {
      schema: SCHEMA_VERSION,
      name: originalFilename,
      image: imageDataURL,
      fonts: Object.keys(texts.reduce(function (acc, t) {
        const name = cleanFamily(t.font);
        if (name) acc[name] = true;
        return acc;
      }, {})),
      texts: texts,
      crops: crops.map(function (c) {
        return {
          key: c.key,
          ratio: document.getElementById('ratio-' + c.key).value,
          show: c.show,
          x: c.x, y: c.y, w: c.w, h: c.h
        };
      }),
      exactSize: {
        mode: sizeMode,
        inches: exactInches,
        unit: sizeUnit(),
        single: orientationIsRadio(),
        border: document.getElementById('print-border').checked
      }
    };
    const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
    downloadBlob(blob, /\.json$/i.test(name) ? name : name + '.json');
  });

  projectInput.addEventListener('change', function () {
    const file = projectInput.files && projectInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        loadProject(migrate(JSON.parse(reader.result)));
      } catch (err) {
        alert('Could not load project: ' + err.message);
      }
    };
    reader.readAsText(file);
    // Let the same file be picked again after a failed load
    projectInput.value = '';
  });

  // Validates a parsed project file and brings it up to the current shape.
  // ponytail: only v1.x exists so far, so there is nothing to convert yet. When the
  // shape changes, bump SCHEMA_VERSION's major and convert older majors here.
  function migrate(data) {
    if (!data || typeof data.schema !== 'string' || typeof data.image !== 'string') {
      throw new Error('not a thumbnailer project file');
    }
    const major = parseInt(data.schema.split('.')[0], 10);
    if (!(major >= 1)) throw new Error('unrecognised schema "' + data.schema + '"');
    if (major > 1) throw new Error('schema ' + data.schema + ' needs a newer version of this tool');
    return data;
  }

  function loadProject(data) {
    setImage(data.image, data.name || 'thumbnail', function () {
      // Merge over the defaults so files written by older versions still open
      texts = (Array.isArray(data.texts) ? data.texts : []).map(function (t) {
        return Object.assign({}, TEXT_DEFAULTS, t);
      });
      selected = -1;
      const missing = missingFonts(texts);
      if (missing.length) {
        alert('This project uses fonts that are not installed here:\n\n' +
              missing.join('\n') + '\n\nThey will render in ' + FONT_FALLBACK + '.');
      }
      (Array.isArray(data.crops) ? data.crops : []).forEach(function (saved) {
        const crop = crops.filter(function (c) { return c.key === saved.key; })[0];
        if (!crop) return;
        const select = document.getElementById('ratio-' + crop.key);
        const known = Array.prototype.some.call(select.options, function (o) {
          return o.value === saved.ratio;
        });
        if (known) select.value = saved.ratio;
        crop.ratio = parseRatio(select.value);
        crop.show = saved.show !== false;
        document.getElementById('show-' + crop.key).checked = crop.show;
        ['x', 'y', 'w', 'h'].forEach(function (k) {
          if (typeof saved[k] === 'number') crop[k] = saved[k];
        });
      });
      const size = data.exactSize;
      if (size && typeof size === 'object') {
        if (size.unit === 'in' || size.unit === 'mm') document.getElementById('size-unit').value = size.unit;
        document.getElementById('print-border').checked = !!size.border;
        sizeMode = ['width', 'height'].indexOf(size.mode) >= 0 ? size.mode : 'none';
        exactInches = sizeMode !== 'none' && +size.inches > 0 ? +size.inches : null;
        document.querySelector('input[name="size-mode"][value="' + sizeMode + '"]').checked = true;
        ['width', 'height'].forEach(function (dim) {
          sizeField(dim).disabled = dim !== sizeMode;
          if (dim === sizeMode) sizeField(dim).value = exactInches ? fromInches(exactInches, sizeUnit()) : '';
        });
        if (size.single || sizeMode !== 'none') makeOrientationRadios();
        else makeOrientationCheckboxes();
      } else if (orientationIsRadio()) {
        // Files from before exact size: keep the current mode, but a project saved with both
        // orientations shown must still leave one pick-one choice
        makeOrientationRadios();
      }
    });
  }

  // Self-check for the geometry helpers: /apps/thumbnailer.html?selftest
  if (location.search.includes('selftest')) {
    const a = fitRect(1000, 500, 16 / 9);
    console.assert(Math.abs(a.w / a.h - 16 / 9) < 1e-9 && a.w <= 1000 && a.h <= 500, 'fitRect landscape');
    const b = fitRect(1000, 500, 9 / 16);
    console.assert(Math.abs(b.h - 500) < 1e-9 && Math.abs(b.x - (1000 - b.w) / 2) < 1e-9, 'fitRect portrait fills height');
    console.assert(clamp(5, 0, 3) === 3 && clamp(-1, 0, 3) === 0, 'clamp');
    console.assert(Math.abs(parseRatio('16:9') - 16 / 9) < 1e-9, 'parseRatio');
    console.assert(alignOffset(100, 40, 'left') === 0, 'align left');
    console.assert(alignOffset(100, 40, 'center') === 30, 'align center');
    console.assert(alignOffset(100, 40, 'right') === 60, 'align right');
    console.assert(alignOffset(100, 100, 'center') === 0, 'align widest line never moves');
    console.assert(hexToRgba('#000000', 1) === 'rgba(0,0,0,1)', 'hexToRgba black');
    console.assert(hexToRgba('#ffffff', 0.5) === 'rgba(255,255,255,0.5)', 'hexToRgba white');
    console.assert(hexToRgba('#4285f4', 0.2) === 'rgba(66,133,244,0.2)', 'hexToRgba channels');
    const ok = { schema: '1.0.0', image: 'data:image/png;base64,x' };
    console.assert(migrate(ok) === ok, 'migrate accepts current schema');
    console.assert(migrate({ schema: '1.7.2', image: 'x' }), 'migrate accepts later v1 minors');
    [{}, { schema: '1.0.0' }, { schema: 'nope', image: 'x' }, { schema: '2.0.0', image: 'x' }]
      .forEach(function (bad, i) {
        let threw = false;
        try { migrate(bad); } catch (e) { threw = true; }
        console.assert(threw, 'migrate rejects bad input ' + i);
      });
    console.assert(cleanFamily('  Impact  ') === 'Impact', 'cleanFamily trims');
    console.assert(cleanFamily('Ev"il\\') === 'Evil', 'cleanFamily strips quotes and backslashes');
    console.assert(cleanFamily(undefined) === '', 'cleanFamily handles missing');
    console.assert(crc32(new TextEncoder().encode('IEND')) === 0xAE426082, 'crc32 matches PNG IEND');
    console.assert(new DataView(physChunk(96).buffer).getUint32(8) === 3780, 'pHYs 96 dpi = 3780 px/m');
    const st = [{ x: 100, y: 50, size: 40, shadow: 10 }];
    scaleTexts(st, 2, 0.5);
    console.assert(st[0].x === 200 && st[0].y === 25 && st[0].size === 20 && st[0].shadow === 5, 'scaleTexts');
    console.assert(fromInches(1, 'mm') === 25.4 && toInches(25.4, 'mm') === 1, 'mm conversion');
    console.log('thumbnailer selftest done');
  }
</script>
